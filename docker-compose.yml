version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: ucrsystem_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ucrsystem
      MYSQL_USER: ucrs_user
      MYSQL_PASSWORD: ucrs_password
    volumes:
      - ucrs_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ucrs_user", "-pucrs_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: ucrsystem_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ucrs_user
      DB_PASSWORD: ucrs_password
      DB_NAME: ucrsystem
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public:ro

volumes:
  ucrs_db_data:
    driver: local
